services:
  derper:
    build:
      context: .
      target: runtime
      args:
        # Empty values let the Dockerfile read the two repository lock files.
        # Overrides must be supplied as a TS_VERSION / TS_COMMIT pair.
        TS_VERSION: ${TS_VERSION:-}
        TS_COMMIT: ${TS_COMMIT:-}
    image: ${DERPER_IMAGE:-ts-derper-stack:dev}
