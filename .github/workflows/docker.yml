name: docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      ts_version:
        description: Optional Tailscale version override; requires ts_commit.
        required: false
        type: string
      ts_commit:
        description: Immutable 40-character Git commit for ts_version; requires ts_version.
        required: false
        type: string
      publish:
        description: Publish from the default branch and write the Tailscale version tag
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ts_version:
        description: Tailscale version override; requires ts_commit.
        required: false
        type: string
      ts_commit:
        description: Immutable 40-character Git commit for ts_version; requires ts_version.
        required: false
        type: string
      publish:
        description: Allow a default-branch caller to publish and write the Tailscale version tag
        required: false
        default: false
        type: boolean
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    outputs:
      ts_version: ${{ steps.ts_source.outputs.version }}
      ts_commit: ${{ steps.ts_source.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version-file: compose/verify-mock/go.mod
          cache: false

      - name: Test verify mock
        working-directory: compose/verify-mock
        run: go test ./...

      - name: Read and verify Tailscale source lock
        id: ts_source
        env:
          REQUESTED_TS_VERSION: ${{ inputs.ts_version }}
          REQUESTED_TS_COMMIT: ${{ inputs.ts_commit }}
        run: |
          set -Eeuo pipefail

          version="${REQUESTED_TS_VERSION:-}"
          commit="${REQUESTED_TS_COMMIT:-}"
          if [[ -n "${version}" && -z "${commit}" ]] || [[ -z "${version}" && -n "${commit}" ]]; then
            printf 'TS_VERSION and TS_COMMIT must be supplied together.\n' >&2
            exit 1
          fi
          if [[ -z "${version}" ]]; then
            version="$(tr -d '\r\n' < tailscale-version.txt)"
            commit="$(tr -d '\r\n' < tailscale-commit.txt)"
          fi

          if ! [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z][0-9A-Za-z.+-]*)?$ ]]; then
            printf 'Invalid Tailscale version: %s\n' "${version}" >&2
            exit 1
          fi
          if ! [[ "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Invalid Tailscale commit: %s\n' "${commit}" >&2
            exit 1
          fi

          refs="$(git ls-remote --tags https://github.com/tailscale/tailscale.git)"
          resolved="$(awk -v tag="refs/tags/${version}" '$2 == tag "^{}" { print $1; found=1 } END { if (!found) exit 1 }' <<<"${refs}" || true)"
          if [[ -z "${resolved}" ]]; then
            resolved="$(awk -v tag="refs/tags/${version}" '$2 == tag { print $1; found=1 } END { if (!found) exit 1 }' <<<"${refs}" || true)"
          fi
          if [[ "${resolved}" != "${commit}" ]]; then
            printf 'Tailscale tag %s resolves to %s, not locked commit %s.\n'               "${version}" "${resolved:-<missing>}" "${commit}" >&2
            exit 1
          fi

          printf 'version=%s\n' "${version}" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "${commit}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0

      - name: Build runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: ts-derper-stack:ci
          build-args: |
            TS_VERSION=${{ steps.ts_source.outputs.version }}
            TS_COMMIT=${{ steps.ts_source.outputs.commit }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Build verify mock image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          target: verify-mock
          platforms: linux/amd64
          load: true
          push: false
          tags: ts-derper-verify-mock:ci
          cache-from: type=gha,scope=verify-mock
          cache-to: type=gha,mode=max,scope=verify-mock

      - name: Smoke test runtime target
        run: |
          set -Eeuo pipefail

          docker run --detach --name derper-smoke \
            --publish 127.0.0.1::3340 \
            --env DERP_ADDR=:3340 \
            --env DERP_HTTP_PORT=-1 \
            --env DERP_CERT_MODE=letsencrypt \
            ts-derper-stack:ci

          endpoint="http://$(docker port derper-smoke 3340/tcp)"
          for _ in {1..30}; do
            if curl --noproxy '*' --fail --silent --show-error "${endpoint}/generate_204" >/dev/null; then
              exit 0
            fi

            if [[ "$(docker inspect --format '{{.State.Running}}' derper-smoke)" != "true" ]]; then
              docker logs derper-smoke
              exit 1
            fi
            sleep 1
          done

          printf 'Runtime smoke test did not become ready.\n' >&2
          docker logs derper-smoke
          exit 1

      - name: Smoke test verify mock target
        run: |
          set -Eeuo pipefail

          docker run --detach --name verify-mock-smoke \
            --publish 127.0.0.1::8080 \
            ts-derper-verify-mock:ci

          endpoint="http://$(docker port verify-mock-smoke 8080/tcp)"
          for _ in {1..30}; do
            if curl --noproxy '*' --fail --silent --show-error "${endpoint}/healthz" >/dev/null; then
              break
            fi

            if [[ "$(docker inspect --format '{{.State.Running}}' verify-mock-smoke)" != "true" ]]; then
              docker logs verify-mock-smoke
              exit 1
            fi
            sleep 1
          done

          if ! curl --noproxy '*' --fail --silent --show-error "${endpoint}/healthz" >/dev/null; then
            printf 'Verify mock smoke test did not become ready.\n' >&2
            docker logs verify-mock-smoke
            exit 1
          fi

          curl --noproxy '*' --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"NodePublic":"nodekey:smoke"}' \
            "${endpoint}/verify" | jq -e '.Allow == true' >/dev/null

      - name: Print smoke logs
        if: failure()
        run: |
          docker logs derper-smoke || true
          docker logs verify-mock-smoke || true

      - name: Clean up smoke containers
        if: always()
        run: |
          docker rm --force derper-smoke || true
          docker rm --force verify-mock-smoke || true

  publish:
    name: Publish multi-arch image
    needs: build
    # Pushes are limited by the trigger; manual and reusable calls need main plus publish=true.
    if: >-
      needs.build.result == 'success' &&
      (github.event_name == 'push' ||
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.publish == true))
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      TS_VERSION: ${{ needs.build.outputs.ts_version }}
      TS_COMMIT: ${{ needs.build.outputs.ts_commit }}
      DOCKERHUB_ENABLED: ${{ vars.DOCKERHUB_IMAGE != '' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.0.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=${{ vars.DOCKERHUB_IMAGE }},enable=${{ env.DOCKERHUB_ENABLED == 'true' }}
          # Do not move an upstream Tailscale version tag on ordinary main or v* rebuilds.
          # Only the sync workflow and an explicit default-branch manual publish set inputs.publish.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ env.TS_VERSION }},enable=${{ inputs.publish == true }}
          labels: |
            org.opencontainers.image.title=ts-derper-stack
            org.opencontainers.image.description=Multi-arch Tailscale DERP relay image bundling derper, tailscaled and tailscale.
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
            org.opencontainers.image.version=${{ env.TS_VERSION }}
            org.opencontainers.image.tailscale.version=${{ env.TS_VERSION }}
            org.opencontainers.image.tailscale.revision=${{ env.TS_COMMIT }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: |
            TS_VERSION=${{ env.TS_VERSION }}
            TS_COMMIT=${{ env.TS_COMMIT }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Update Docker Hub description
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_IMAGE }}
          short-description: Multi-arch Tailscale DERP relay with derper, tailscaled and tailscale.
          readme-filepath: README.md
          enable-url-completion: true
